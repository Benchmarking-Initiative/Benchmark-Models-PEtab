name: Simulate
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'problems/**'
      - 'src/python/simulate.py'
      - '.github/workflows/simulate.yml'
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: '0 0 * * *'

jobs:
  simulate_amici:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Prepare Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install AMICI
      env:
        AMICI_PARALLEL_COMPILE: ""
      run: |
        pip install --upgrade pip
        # TODO: once amici 1.0 is released, replace with:
        # pip install amici[petab]
        pip install petab
        pip install "git+https://github.com/dweindl/amici.git@6a85422ad233fc268fb71272bba39f5b82db387a#egg=amici&subdirectory=python/sdist"

    - name: Simulate and compare to the simulation tables
      env:
        AMICI_PARALLEL_COMPILE: ""
        # The problems are simulated with the solver settings of
        # src/python/solver_settings.yaml.
        # Problems whose simulation tables are known not to match the
        # simulations at the nominal parameters. They are simulated and
        # reported, but do not fail the job. Remove a problem from this list
        # once its simulation table has been fixed.
        KNOWN_FAILURES: >-
          Liu_IFACPapersOnLine2025
      run: |
        failed=()
        known_failed=()
        fixed=()
        for problem in `ls -1 problems/`; do
            known=false
            [[ " $KNOWN_FAILURES " == *" $problem "* ]] && known=true
            if python src/python/simulate.py "$problem" -j \
                --check-simulations; then
                $known && fixed+=("$problem")
            elif $known; then
                known_failed+=("$problem")
            else
                failed+=("$problem")
            fi
            echo
            echo
        done

        {
          echo "### Comparison to the simulation tables"
          echo
          echo "Failed: ${failed[*]:-none}"
          echo
          echo "Known failures (\`KNOWN_FAILURES\`): ${known_failed[*]:-none}"
          echo
          echo "Known failures that now pass, to be removed from \`KNOWN_FAILURES\`: ${fixed[*]:-none}"
        } | tee -a "$GITHUB_STEP_SUMMARY"

        [ ${#failed[@]} -eq 0 ] && [ ${#fixed[@]} -eq 0 ]
